name: Build WygTV iPhone IPA
on:
  push:
    branches: [app]
    paths: ['WygTV-iOS/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate iOS project
        working-directory: WygTV-iOS
        run: xcodegen generate
      - name: Build for iPhone
        working-directory: WygTV-iOS
        run: xcodebuild -project WygTV.xcodeproj -scheme WygTV -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for AltServer signing
        working-directory: WygTV-iOS
        run: |
          mkdir -p package/Payload
          ditto build/Build/Products/Release-iphoneos/WygTV.app package/Payload/WygTV.app
          cd package
          zip -qry ../wygtv.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WygTV-iPhone-IPA
          path: WygTV-iOS/wygtv.ipa
          if-no-files-found: error
