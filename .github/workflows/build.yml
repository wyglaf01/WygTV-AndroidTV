name: Build WygTV Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [app, main, "codex/**"]
  pull_request:
    branches: [app, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android app module
        run: |
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::Missing app/build.gradle. Upload the complete app directory to the repository root."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Name the APK wygtv.apk
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/wygtv.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wygtv
          path: dist/wygtv.apk
          if-no-files-found: error


      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WygTV-check-reports
          path: app/build/reports/
          if-no-files-found: ignore

  # Publishes wygtv.apk to a public GitHub Release so it has a fixed direct link
  # (for Downloader codes):
  # https://github.com/wyglaf01/WygTV-AndroidTV/releases/latest/download/wygtv.apk
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/app')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wygtv
          path: dist

      - name: Update the WygTV release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: wygtv-latest
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="Latest WygTV build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC').

          Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wygtv.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WygTV (latest build)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "WygTV (latest build)" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" dist/wygtv.apk --clobber
