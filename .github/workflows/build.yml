name: Build WygTV Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android app module
        run: |
          test -f app/build.gradle -o -f app/build.gradle.kts || {
            echo "::error::Missing app/build.gradle. Upload the full app folder first."
            exit 1
          }

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WygTV-AndroidTV-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
