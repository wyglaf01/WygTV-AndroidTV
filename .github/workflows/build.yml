name: Build WygTV and WygOTA

on:
  workflow_dispatch:
  push:
    branches: [app, main, "codex/**"]
  pull_request:
    branches: [app, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android app module
        run: |
          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::Missing app/build.gradle. Upload the complete app directory to the repository root."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load the WygTV signing key
        env:
          WYGTV_KEYSTORE_B64: ${{ secrets.WYGTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$WYGTV_KEYSTORE_B64" ]; then
            echo "$WYGTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/wygtv-release.jks"
            echo "WYGTV_KEYSTORE=$RUNNER_TEMP/wygtv-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::WYGTV_KEYSTORE_B64 secret not set; signing with a temporary debug key."
          fi

      - name: Check and build debug APKs (WygTV and WygOTA)
        env:
          WYGTV_KEY_PASSWORD: ${{ secrets.WYGTV_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: gradle --no-daemon :app:lintWygtvDebug :app:lintWygotaDebug :app:testWygtvDebugUnitTest :app:testWygotaDebugUnitTest :app:assembleWygtvDebug :app:assembleWygotaDebug

      - name: Name the APKs wygtv.apk and wygota.apk
        run: |
          mkdir -p dist/wygtv dist/wygota
          cp app/build/outputs/apk/wygtv/debug/*.apk dist/wygtv/wygtv.apk
          cp app/build/outputs/apk/wygota/debug/*.apk dist/wygota/wygota.apk
          # Each app's in-app updater reads its version.json to know whether a newer build exists.
          for d in dist/wygtv dist/wygota; do
            echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > "$d/version.json"
          done
          cat dist/wygtv/version.json

      - name: Upload WygTV APK
        uses: actions/upload-artifact@v4
        with:
          name: wygtv
          path: |
            dist/wygtv/wygtv.apk
            dist/wygtv/version.json
          if-no-files-found: error

      - name: Upload WygOTA APK
        uses: actions/upload-artifact@v4
        with:
          name: wygota
          path: |
            dist/wygota/wygota.apk
            dist/wygota/version.json
          if-no-files-found: error


      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WygTV-check-reports
          path: app/build/reports/
          if-no-files-found: ignore

  # WygOTA for Ubuntu: a .deb built with jpackage (bundles its own Java; needs VLC, which apt installs with it).
  # Built on the oldest supported Ubuntu so the package installs on 22.04 and newer.
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build WygOTA for Linux
        run: gradle --no-daemon -p desktop test installDist

      - name: Package wygota.deb
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fakeroot
          mkdir -p dist
          jpackage --type deb --dest dist --name wygota --app-version "1.0.${GITHUB_RUN_NUMBER}" \
            --input desktop/build/install/wygota/lib --main-jar wygota.jar --main-class com.wygtv.tv.OtaDesktop \
            --icon desktop/packaging/wygota.png --description "WygOTA: live antenna TV from an HDHomeRun tuner" \
            --vendor WygTV --linux-shortcut --linux-menu-group "AudioVideo;Video;TV" --linux-app-category video \
            --linux-package-deps vlc --linux-deb-maintainer "wygota@users.noreply.github.com"
          mv dist/wygota_*.deb dist/wygota_amd64.deb
          dpkg-deb -I dist/wygota_amd64.deb

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: wygota-linux
          path: dist/wygota_amd64.deb
          if-no-files-found: error

  # Publishes wygtv.apk to a public GitHub Release so it has a fixed direct link
  # (for Downloader codes):
  # https://github.com/wyglaf01/WygTV-AndroidTV/releases/latest/download/wygtv.apk
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/app')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: wygtv
          path: dist

      - name: Update the WygTV release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: wygtv-latest
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="Latest WygTV build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC').

          Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/wygtv.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WygTV (latest build)" --notes "$NOTES" --latest
          else
            gh release create "$TAG" --title "WygTV (latest build)" --notes "$NOTES" --latest
          fi
          gh release upload "$TAG" dist/wygtv.apk dist/version.json --clobber

  # WygOTA's own release (not marked latest, so WygTV's links keep working):
  # https://github.com/wyglaf01/WygTV-AndroidTV/releases/download/wygota-latest/wygota.apk
  # https://github.com/wyglaf01/WygTV-AndroidTV/releases/download/wygota-latest/wygota_amd64.deb
  publish-wygota:
    needs: [build, linux]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/app')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download WygOTA APK
        uses: actions/download-artifact@v4
        with:
          name: wygota
          path: dist

      - name: Download WygOTA for Linux
        uses: actions/download-artifact@v4
        with:
          name: wygota-linux
          path: dist

      - name: Update the WygOTA release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: wygota-latest
        run: |
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NOTES="Latest WygOTA build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC').

          Android TV and tablets: $URL/wygota.apk
          Ubuntu: $URL/wygota_amd64.deb (install with: sudo apt install ./wygota_amd64.deb)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "WygOTA (latest build)" --notes "$NOTES" --latest=false
          else
            gh release create "$TAG" --title "WygOTA (latest build)" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG" dist/wygota.apk dist/version.json dist/wygota_amd64.deb --clobber
