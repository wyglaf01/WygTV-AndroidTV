name: Build WygDesktop (Windows and Ubuntu) and WygTV-Mac (macOS)

on:
  workflow_dispatch:
  push:
    branches: [app, "claude/**"]
    paths: ["WygDesktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    branches: [app]
    paths: ["WygDesktop/**", ".github/workflows/desktop.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            files: |
              WygDesktop/dist/WygDesktop-Setup.exe
              WygDesktop/dist/WygDesktop-Portable.exe
          - os: ubuntu-latest
            target: linux
            files: |
              WygDesktop/dist/WygDesktop-linux.AppImage
              WygDesktop/dist/WygDesktop-linux.deb
          # WygTV-Mac: each Mac kind is built (and tried) on its own kind of Mac, so FFmpeg matches it.
          - os: macos-latest
            target: mac
            arch: arm64
            label: AppleSilicon
            files: WygDesktop/dist/WygTV-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            target: mac
            arch: x64
            label: Intel
            files: WygDesktop/dist/WygTV-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: WygDesktop
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WygDesktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        if: matrix.target == 'linux'
        run: npm test

      # ffmpeg-static's Linux build crashes on newer kernels (Ubuntu 24.04), so the AppImage also ships a
      # current static FFmpeg from BtbN/FFmpeg-Builds. The .deb uses Ubuntu's own ffmpeg package.
      - name: Get a current static FFmpeg for Linux
        if: matrix.target == 'linux'
        run: |
          mkdir -p vendor/ffmpeg-linux "$RUNNER_TEMP/ffdl"
          curl -sfL --retry 3 -o "$RUNNER_TEMP/ffdl/ff.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf "$RUNNER_TEMP/ffdl/ff.tar.xz" -C "$RUNNER_TEMP/ffdl"
          cp "$RUNNER_TEMP"/ffdl/ffmpeg-*/bin/ffmpeg vendor/ffmpeg-linux/ffmpeg
          chmod +x vendor/ffmpeg-linux/ffmpeg
          vendor/ffmpeg-linux/ffmpeg -hide_banner -version | head -1

      - name: Set the version (1.0.<build number>)
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:${{ matrix.target }} -- ${{ matrix.target == 'mac' && format('--{0} -c.mac.artifactName=WygTV-Mac-{1}.dmg', matrix.arch, matrix.label) || '' }}

      # Opens the .dmg, copies WygTV-Mac.app out like a person would, and has it play a direct H.264 channel
      # and an MPEG-2/AC-3 channel through its FFmpeg from a pretend IPTV service (see src/main/smoke.js).
      - name: Try WygTV-Mac
        if: matrix.target == 'mac'
        timeout-minutes: 15
        run: |
          FF="$(node -p "require('ffmpeg-static')")"
          if ! "$FF" -hide_banner -encoders 2>/dev/null | grep -q libx264; then brew install ffmpeg >/dev/null; FF=ffmpeg; fi
          mkdir -p "$RUNNER_TEMP/media/hls"
          "$FF" -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 40 -c:v libx264 -preset ultrafast -g 50 -c:a aac -f mpegts "$RUNNER_TEMP/media/h264.ts"
          "$FF" -loglevel error -y -f lavfi -i smptebars=size=720x480:rate=30 -f lavfi -i sine=frequency=300 -t 40 -c:v mpeg2video -b:v 4M -c:a ac3 -f mpegts "$RUNNER_TEMP/media/mpeg2.ts"
          "$FF" -loglevel error -y -i "$RUNNER_TEMP/media/h264.ts" -c copy -f hls -hls_time 4 -hls_list_size 0 "$RUNNER_TEMP/media/hls/index.m3u8"
          nohup node test/mock-server.js 8765 "$RUNNER_TEMP/media" > "$RUNNER_TEMP/mock.log" 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8765/player_api.php?username=demo&password=demo" >/dev/null
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/WygTV-Mac-${{ matrix.label }}.dmg
          ls "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/dmg/WygTV-Mac.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          APP="$RUNNER_TEMP/WygTV-Mac.app"
          codesign --verify --deep --strict "$APP" && codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Signature'
          lipo -archs "$APP/Contents/MacOS/WygTV-Mac"
          "$APP/Contents/MacOS/WygTV-Mac" --smoke=http://127.0.0.1:8765 2>&1 | tee "$RUNNER_TEMP/smoke.log" | grep -E 'WYG-SMOKE|rror' ; test "${PIPESTATUS[0]}" = 0

      - name: Mac logs
        if: failure() && matrix.target == 'mac'
        run: tail -n 80 "$RUNNER_TEMP/smoke.log" "$RUNNER_TEMP/mock.log" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wygdesktop-${{ matrix.target }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Installs the .deb and runs the AppImage on real Ubuntu 22.04 and 24.04 machines, and has each one
  # play a direct H.264 channel and an MPEG-2/AC-3 channel through the bundled FFmpeg (see src/main/smoke.js).
  ubuntu-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download the Ubuntu build
        uses: actions/download-artifact@v4
        with:
          name: wygdesktop-linux
          path: pkg

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Make test videos and start a pretend IPTV service
        working-directory: WygDesktop
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          mkdir -p "$RUNNER_TEMP/media/hls"
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 40 -c:v libx264 -preset ultrafast -g 50 -c:a aac -f mpegts "$RUNNER_TEMP/media/h264.ts"
          ffmpeg -loglevel error -y -f lavfi -i smptebars=size=720x480:rate=30 -f lavfi -i sine=frequency=300 -t 40 -c:v mpeg2video -b:v 4M -c:a ac3 -f mpegts "$RUNNER_TEMP/media/mpeg2.ts"
          ffmpeg -loglevel error -y -i "$RUNNER_TEMP/media/h264.ts" -c copy -f hls -hls_time 4 -hls_list_size 0 "$RUNNER_TEMP/media/hls/index.m3u8"
          nohup node test/mock-server.js 8765 "$RUNNER_TEMP/media" > "$RUNNER_TEMP/mock.log" 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8765/player_api.php?username=demo&password=demo"

      - name: Install the .deb (apt resolves its dependencies)
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb ./pkg/WygDesktop-linux.deb
          dpkg -s wygdesktop | grep -E '^(Version|Depends)'
          ls -l /opt/WygDesktop/chrome-sandbox
          ls -l /etc/apparmor.d/wygdesktop || echo "no AppArmor profile (not needed on this Ubuntu)"

      - name: Run the installed app
        run: timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" wygdesktop --smoke=http://127.0.0.1:8765 2>&1 | tee deb.log | grep -E 'WYG-SMOKE|rror' ; test "${PIPESTATUS[0]}" = 0

      - name: Run the AppImage (needs libfuse2)
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then sudo apt-get install -y -q libfuse2t64; else sudo apt-get install -y -q libfuse2; fi
          chmod +x pkg/WygDesktop-linux.AppImage
          # WYG_NO_SYSTEM_FFMPEG: ignore apt's ffmpeg (pulled in by the .deb) so the AppImage's own FFmpeg is tested.
          WYG_NO_SYSTEM_FFMPEG=1 timeout 300 xvfb-run -a -s "-screen 0 1600x900x24" ./pkg/WygDesktop-linux.AppImage --smoke=http://127.0.0.1:8765 2>&1 | tee appimage.log | grep -E 'WYG-SMOKE|rror' ; test "${PIPESTATUS[0]}" = 0

      - name: Logs
        if: failure()
        run: tail -n 80 deb.log appimage.log "$RUNNER_TEMP/mock.log" || true

  # Fixed download links:
  #   app branch     → release wygdesktop-latest (also used by the in-app "Check for updates")
  #   other branches → release wygdesktop-test (for trying a pull request before merging)
  publish:
    needs: [build, ubuntu-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update the WygDesktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "app" ]; then TAG=wygdesktop-latest; TITLE="WygDesktop and WygTV-Mac (latest build)"; else TAG=wygdesktop-test; TITLE="WygDesktop and WygTV-Mac (test build from $GITHUB_REF_NAME)"; fi
          echo "{\"version\": \"1.0.${GITHUB_RUN_NUMBER}\", \"notes\": \"${GITHUB_REF_NAME} ${GITHUB_SHA::7}\"}" > dist/desktop-version.json
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          NOTES="WygDesktop 1.0.${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC').

          Windows installer: $URL/WygDesktop-Setup.exe
          Windows portable (no install): $URL/WygDesktop-Portable.exe
          Ubuntu .deb: $URL/WygDesktop-linux.deb
          Ubuntu AppImage: $URL/WygDesktop-linux.AppImage
          WygTV-Mac for Apple Silicon Macs (M1 and newer): $URL/WygTV-Mac-AppleSilicon.dmg
          WygTV-Mac for Intel Macs: $URL/WygTV-Mac-Intel.dmg

          WygTV-Mac isn't signed by Apple yet. The first time: open the .dmg, drag WygTV-Mac into Applications, open it,
          click Done, then System Settings → Privacy & Security → Open Anyway (or right-click → Open on older macOS)."
          # Kept as a pre-release so it never replaces WygTV's APK as the repository's "latest" release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi
          gh release upload "$TAG" dist/WygDesktop-Setup.exe dist/WygDesktop-Portable.exe dist/WygDesktop-linux.deb dist/WygDesktop-linux.AppImage dist/WygTV-Mac-AppleSilicon.dmg dist/WygTV-Mac-Intel.dmg dist/desktop-version.json --clobber
