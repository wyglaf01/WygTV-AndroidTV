name: Build WygTV for Samsung TVs (Tizen)

# WygTV for Samsung Smart TVs is WygDesktop's screens packaged as a Tizen TV web app (folder WygTV-Tizen/).
# The .wgt is built unsigned: Samsung TVs only install packages signed with the owner's Samsung certificate
# (Tizen Studio → Certificate Manager), so it is signed on the owner's computer (see WygTV-Tizen/README.md).

on:
  workflow_dispatch:
  push:
    branches: [app, "claude/**"]
    paths: ["WygTV-Tizen/**", "WygDesktop/src/renderer/**", "WygDesktop/src/main/m3u.js", "WygDesktop/src/main/xmltv.js", "WygDesktop/src/main/hdhr.js", "WygDesktop/src/main/tablo.js", ".github/workflows/tizen.yml"]
  pull_request:
    branches: [app]
    paths: ["WygTV-Tizen/**", "WygDesktop/src/renderer/**", "WygDesktop/src/main/m3u.js", "WygDesktop/src/main/xmltv.js", "WygDesktop/src/main/hdhr.js", "WygDesktop/src/main/tablo.js", ".github/workflows/tizen.yml"]

concurrency:
  group: tizen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build WygTV.wgt
        working-directory: WygTV-Tizen
        run: |
          npm ci --no-audit --no-fund
          node scripts/build.mjs "1.0.${{ github.run_number }}"
          for f in build/app/js/*.js; do node --check "$f"; done

      - name: Load it in a browser (no script errors, remote Back key mapped)
        working-directory: WygTV-Tizen
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium >/dev/null
          python scripts/smoke.py build/app dist/WygTV-tizen-home.png

      - uses: actions/upload-artifact@v4
        with:
          name: WygTV-Tizen
          path: WygTV-Tizen/dist/

      # Pushes publish (pull requests only build):
      #   app branch     → release wygtv-tizen-latest (also the in-app "Check for updates")
      #   other branches → release wygtv-tizen-test (for trying a pull request before merging)
      - name: Update the WygTV for Samsung TVs release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" = "app" ]; then TAG=wygtv-tizen-latest; TITLE="WygTV for Samsung TVs (latest build)"; else TAG=wygtv-tizen-test; TITLE="WygTV for Samsung TVs (test build from $GITHUB_REF_NAME)"; fi
          VERSION=$(jq -r .version WygTV-Tizen/dist/tizen-version.json)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="WygTV ${VERSION} for Samsung Smart TVs (Tizen 5.5 and newer: 2020 and later TVs).

          Download: ${URL}/WygTV.wgt

          The package is unsigned: sign it with your Samsung certificate and install it on your TV with Tizen Studio
          (step by step: https://github.com/${GITHUB_REPOSITORY}/blob/app/WygTV-Tizen/README.md)."
          # Kept as a pre-release so it never replaces WygTV's APK as the repository's "latest" release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease --latest=false
          fi
          cd WygTV-Tizen/dist
          gh release upload "$TAG" WygTV.wgt tizen-version.json WygTV-tizen-home.png --clobber
