plugins { id 'com.android.application' }
// WYGOTA=1 builds WygOTA instead of WygTV: the antenna-TV-only app (com.wygtv.ota), with the antenna
// icons in src/wygota/res and the WygOTA name. It installs next to WygTV and WygTV Beta.
def wygota = System.getenv('WYGOTA') == '1'
// GALAXY_STORE=1 builds WygTV for the Samsung Galaxy Store: a release (not debuggable) APK without the
// in-app updater, its install permission and receivers (src/galaxy/AndroidManifest.xml), because store
// apps must update only through the store. Build it with `GALAXY_STORE=1 gradle :app:assembleRelease`.
def galaxy = System.getenv('GALAXY_STORE') == '1'
android { namespace 'com.wygtv.tv'; compileSdk 35
    defaultConfig { applicationId wygota ? 'com.wygtv.ota' : System.getenv('WYGTV_BETA') == '1' ? 'com.wygtv.tv.beta' : 'com.wygtv.tv'; minSdk 23; targetSdk 28; versionCode((System.getenv('WYGTV_VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int); versionName "1.0.${System.getenv('WYGTV_VERSION_CODE') ?: System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        // Beta builds (WYGTV_BETA=1) are labelled "WygTV Beta" and use the burnt-orange icons in src/beta/res.
        // They are a separate app (com.wygtv.tv.beta), so the beta and the release can be installed side by side.
        manifestPlaceholders = [appLabel: wygota ? 'WygOTA' : System.getenv('WYGTV_BETA') == '1' ? 'WygTV Beta' : 'WygTV']
        buildConfigField 'boolean', 'OTA', wygota ? 'true' : 'false'
        buildConfigField 'boolean', 'STORE', galaxy ? 'true' : 'false'
        // Optional TMDb key for movie/series details, from the GitHub secret TMDB_API_KEY (Settings can override it).
        buildConfigField 'String', 'TMDB_API_KEY', "\"${(System.getenv('TMDB_API_KEY') ?: '').replaceAll('[^A-Za-z0-9._-]', '')}\""
        // Eddie's OMDb key is the default (a GitHub secret OMDB_API_KEY replaces it; Settings overrides both).
        buildConfigField 'String', 'OMDB_API_KEY', "\"${(System.getenv('OMDB_API_KEY') ?: '5b5c4d64').replaceAll('[^A-Za-z0-9._-]', '')}\"" }
    buildFeatures { buildConfig true }
    if (galaxy) { sourceSets { release { manifest.srcFile 'src/galaxy/AndroidManifest.xml' } } }
    if (wygota) { sourceSets { debug { res.srcDirs = ['src/wygota/res'] } } }
    else if (System.getenv('WYGTV_BETA') == '1') { sourceSets { debug { res.srcDirs = ['src/beta/res'] } } }
    // Preserve the existing sideloaded TV runtime behavior; Play target migration needs device testing.
    lint { warning 'ExpiredTargetSdkVersion' }
    // Permanent WygTV signing key, given to CI as GitHub secrets (never committed), so each
    // new build installs over the last one. Local builds without it keep the normal debug key.
    def wygtvKey = System.getenv('WYGTV_KEYSTORE')
    if (wygtvKey && file(wygtvKey).exists()) {
        signingConfigs {
            wygtv {
                storeFile file(wygtvKey); storeType 'pkcs12'
                storePassword System.getenv('WYGTV_KEY_PASSWORD')
                keyAlias 'wygtv'; keyPassword System.getenv('WYGTV_KEY_PASSWORD')
            }
        }
        buildTypes { debug { signingConfig signingConfigs.wygtv }; release { signingConfig signingConfigs.wygtv } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20231013'; implementation 'androidx.media3:media3-exoplayer:1.9.0'; implementation 'androidx.media3:media3-ui:1.9.0'
    // HLS (.m3u8): Settings > Live stream format and M3U playlists use it, and it carries its own subtitles and captions.
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    // FFmpeg audio decoders (AC-3 / E-AC-3 for over-the-air TV from HDHomeRun tuners), built for Media3 1.9 by Jellyfin (1.9 brings many CEA-608/708 closed-caption fixes for live TV).
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1' }

